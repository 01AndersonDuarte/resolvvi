name: ${COMPOSE_PROJECT_NAME:-harness-import}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_USER: harness
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

