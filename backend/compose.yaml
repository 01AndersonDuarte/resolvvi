name: ${COMPOSE_PROJECT_NAME:-dev_test_resolvvi}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dev_test_resolvvi
      POSTGRES_PASSWORD: dev_test_resolvvi
      POSTGRES_USER: dev_test_resolvvi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_test_resolvvi -d dev_test_resolvvi"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
